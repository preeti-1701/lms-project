



<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}LMS{% endblock %}</title>
</head>

<body>

<!-- 🔴 GLOBAL WATERMARK -->
{% if request.session.user_email and request.path != '/login/' %}
<div style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.12;
">

    <div style="
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 80px;
        width: 100%;
        height: 100%;
        transform: rotate(-30deg);
        font-size: 22px;
        color: black;
    ">
        {% for i in "123456789012345678901234567890" %}
            <div>{{ request.session.user_email }}</div>
        {% endfor %}
    </div>

</div>
{% endif %}

<div style="position: relative; z-index: 2;">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>

<script>
document.addEventListener("contextmenu", function(e){
    e.preventDefault();
});
</script>

<script>
document.addEventListener("keydown", function(e){
    if (e.key === "PrintScreen") {
        alert("Screenshot disabled!");
    }
});
</script>

<script>
document.addEventListener("visibilitychange", function() {
    if (document.hidden) {
        document.body.style.filter = "blur(10px)";
    } else {
        document.body.style.filter = "none";
    }
});
</script>
