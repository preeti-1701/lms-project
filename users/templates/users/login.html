{% extends 'base.html' %}

{% block content %}

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    height: 100vh;
}

.login-container {
    display: flex;
    height: 100vh;
}

/* LEFT SIDE */
.left-panel {
    flex: 1;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px;
}

.left-panel h1 {
    font-size: 40px;
    margin-bottom: 15px;
}

.left-panel p {
    font-size: 18px;
    opacity: 0.9;
}

/* RIGHT SIDE */
.right-panel {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    background: white;
    padding: 40px;
    border-radius: 15px;
    width: 350px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.login-box h2 {
    text-align: center;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ddd;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}
</style>

<div class="login-container">

    <!-- LEFT SIDE -->
    <div class="left-panel">
        <h1>🎓 Welcome to LMS</h1>
        <p>
            Learn. Grow. Succeed.  
            Access your courses, track progress, and earn certificates.
        </p>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right-panel">
        <div class="login-box">
            <h2>🔐 Login</h2>

            <form method="POST">
                {% csrf_token %}

                <input type="email" name="email" placeholder="Enter Email" required>
                <input type="password" name="password" placeholder="Enter Password" required>

                <button type="submit">Login</button>
            </form>
        </div>
    </div>

</div>

{% endblock %}
