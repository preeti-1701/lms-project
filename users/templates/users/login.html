{% extends 'base.html' %}

{% block content %}

<style>
.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 90vh;
}

.login-card {
    background: white;
    padding: 30px;
    width: 350px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    text-align: center;
}

.login-card h2 {
    margin-bottom: 20px;
}

.input-box {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.login-btn {
    width: 100%;
    padding: 10px;
    background: linear-gradient(45deg, #3498db, #2ecc71);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

.login-btn:hover {
    opacity: 0.9;
}

body {
    background: linear-gradient(to right, #74ebd5, #acb6e5);
}
</style>

<div class="login-container">

    <div class="login-card">

        <h2>🔐 Login</h2>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="email" placeholder="Enter Email" class="input-box" required>

            <input type="password" name="password" placeholder="Enter Password" class="input-box" required>

            <button type="submit" class="login-btn">Login</button>

        </form>

    </div>

</div>

{% endblock %}
