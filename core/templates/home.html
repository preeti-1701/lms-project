<h1>LMS Courses</h1>

{% for course in courses %}
  <div>
    <h2>{{ course.title }}</h2>
    <p>{{ course.description }}</p>
    <p>Status: {{ course.status }}</p>
    <a href="/course/{{ course.id }}/">View Course</a>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </div>
{% endfor %}
