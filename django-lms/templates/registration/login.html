{% extends "base.html" %}
{% block title %}Sign in · LearnHub{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Welcome back</h1>
  <form method="post">{% csrf_token %}
    {{ form.non_field_errors }}
    <label>Username<br>{{ form.username }}</label>
    <label>Password<br>{{ form.password }}</label>
    <button class="btn btn-primary w-full" type="submit">Sign in</button>
  </form>
  <p class="muted">No account? <a href="{% url 'signup' %}">Create one</a>.</p>
</div>
{% endblock %}
