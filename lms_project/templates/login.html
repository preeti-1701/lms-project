{% extends 'base.html' %}
{% block content %}

<div style="max-width: 380px; margin: 60px auto 0;">

  <div style="margin-bottom: 28px;">
    <h1 style="font-size: 22px; font-weight: 500; letter-spacing: -0.3px;">Sign in</h1>
    <p style="color: var(--ink-2); font-size: 14px; margin-top: 4px;">Enter your email and password to continue.</p>
  </div>

  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 8px; padding: 10px;">
      Sign in
    </button>
  </form>

  <p style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--ink-2);">
    No account? <a href="{% url 'register' %}" style="color: var(--accent); text-decoration: none; font-weight: 500;">Create one</a>
  </p>

</div>

{% endblock %}
