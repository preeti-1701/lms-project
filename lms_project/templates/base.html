<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1a1a;
      --ink-2: #555;
      --ink-3: #999;
      --line: #e5e5e5;
      --surface: #fff;
      --bg: #f6f5f2;
      --accent: #2563eb;
      --accent-light: #eff4ff;
      --danger: #dc2626;
      --success: #16a34a;
      --warn: #d97706;
      --radius: 8px;
      --font: 'DM Sans', sans-serif;
      --mono: 'DM Mono', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 15px;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: -0.3px;
    }

    .nav-brand span {
      color: var(--accent);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-user {
      font-size: 13px;
      color: var(--ink-2);
    }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }

    .btn-ghost {
      background: transparent;
      color: var(--ink-2);
      border-color: var(--line);
    }
    .btn-ghost:hover { background: var(--bg); color: var(--ink); }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border-color: #fecaca;
    }
    .btn-danger:hover { background: #fef2f2; }

    .btn-warn {
      background: transparent;
      color: var(--warn);
      border-color: #fde68a;
    }
    .btn-warn:hover { background: #fffbeb; }

    .btn-success {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }
    .btn-success:hover { background: #15803d; }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
    }

    /* LAYOUT */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px;
      flex: 1;
      width: 100%;
    }

    /* INPUTS */
    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 14px;
      color: var(--ink);
      background: var(--surface);
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-2);
      margin-bottom: 5px;
    }

    .field { margin-bottom: 16px; }

    /* CARD */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px 24px;
    }

    /* ALERT */
    .alert {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      margin-bottom: 16px;
    }
    .alert-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .alert-info { background: var(--accent-light); color: #1e40af; border: 1px solid #bfdbfe; }

    /* BADGE */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      font-family: var(--mono);
    }
    .badge-blue { background: var(--accent-light); color: var(--accent); }
    .badge-green { background: #f0fdf4; color: var(--success); }
    .badge-gray { background: #f5f5f5; color: var(--ink-2); }
    .badge-red { background: #fef2f2; color: var(--danger); }

    /* DIVIDER */
    hr { border: none; border-top: 1px solid var(--line); margin: 20px 0; }

    footer {
      border-top: 1px solid var(--line);
      background: var(--surface);
      text-align: center;
      padding: 16px 24px;
      font-size: 12px;
      color: var(--ink-3);
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<header>
  <nav>
    <a class="nav-brand" href="/">lms<span>.</span></a>
    <div class="nav-right">
      {% if user.is_authenticated %}
      {% if user.role == 'admin' or user.is_superuser %}
        <a href="{% url 'admin_panel' %}" class = "btn btn-ghost btn-sm">Users</a>
        {% endif %}
        <span class="nav-user">{{ user.email }}</span>
        <a href="{% url 'logout' %}" class="btn btn-ghost btn-sm">Sign out</a>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-primary btn-sm">Sign in</a>
      {% endif %}
    </div>
  </nav>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  LMS Platform &mdash; {% now "Y" %}
</footer>

{% block scripts %}{% endblock %}

</body>
</html>
