<!DOCTYPE html>
<html>
<head>
<title>Add Lesson</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Poppins';
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:500px;
    background:white;
    padding:35px;
    border-radius:24px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border-radius:12px;
    border:1px solid #ddd;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#06b6d4,#3b82f6);
    color:white;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="card">

<h2>
🎥 Add Lesson
</h2>

<form method="POST">

{% csrf_token %}

<input type="text"
name="title"
placeholder="Lesson Title"
required>

<input type="url"
name="youtube_link"
placeholder="YouTube Video URL"
required>

<button type="submit">

Add Lesson

</button>

</form>

</div>

</body>
</html>
