<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Course</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            background:linear-gradient(
                135deg,
                #0f172a,
                #1e293b,
                #111827
            );

            min-height:100vh;

            padding:40px;
        }

        .container-box{

            max-width:900px;

            margin:auto;

            background:rgba(255,255,255,0.08);

            backdrop-filter:blur(18px);

            border-radius:25px;

            padding:40px;

            box-shadow:0 10px 40px rgba(0,0,0,0.4);

            color:white;
        }

        h1{

            text-align:center;

            margin-bottom:30px;

            font-weight:700;

            background:linear-gradient(
                to right,
                #38bdf8,
                #a855f7
            );

            -webkit-background-clip:text;

            -webkit-text-fill-color:transparent;
        }

        .form-label{

            font-weight:500;

            margin-bottom:8px;
        }

        .form-control,
        .form-select{

            background:rgba(255,255,255,0.08);

            border:none;

            border-radius:14px;

            padding:14px;

            color:white;
        }

        .form-control:focus,
        .form-select:focus{

            border:1px solid #38bdf8;

            box-shadow:0 0 10px rgba(56,189,248,0.5);

            background:rgba(255,255,255,0.1);

            color:white;
        }

        textarea{
            resize:none;
        }

        .btn-submit{

            width:100%;

            padding:14px;

            border:none;

            border-radius:15px;

            background:linear-gradient(
                135deg,
                #06b6d4,
                #8b5cf6
            );

            color:white;

            font-size:18px;

            font-weight:600;

            transition:0.3s;
        }

        .btn-submit:hover{

            transform:translateY(-3px);

            box-shadow:0 10px 20px rgba(139,92,246,0.5);
        }

        .mb-4{
            margin-bottom:20px;
        }

    </style>

</head>

<body>

<div class="container-box">

    <h1>
        Add New Course
    </h1>

    <form method="POST"
          enctype="multipart/form-data">

        {% csrf_token %}

        <div class="row">

            <div class="col-md-6 mb-4">

                <label class="form-label">
                    Course Title
                </label>

                <input type="text"
                       name="title"
                       class="form-control"
                       placeholder="Enter course title">

            </div>

            <div class="col-md-6 mb-4">

                <label class="form-label">
                    Category
                </label>

                <select name="category"
                        class="form-select">

                    <option>
                        Programming
                    </option>

                    <option>
                        Web Development
                    </option>

                    <option>
                        Python
                    </option>

                    <option>
                        AI & ML
                    </option>

                    <option>
                        Data Science
                    </option>

                </select>

            </div>

        </div>

        <div class="row">

            <div class="col-md-6 mb-4">

                <label class="form-label">
                    Trainer Name
                </label>

                <input type="text"
                       name="trainer"
                       class="form-control"
                       placeholder="Trainer Name">

            </div>

            <div class="col-md-6 mb-4">

                <label class="form-label">
                    Course Price
                </label>

                <input type="number"
                       name="price"
                       class="form-control"
                       placeholder="₹ 999">

            </div>

        </div>

        <div class="mb-4">

            <label class="form-label">
                Course Description
            </label>

            <textarea name="description"
                      rows="5"
                      class="form-control"
                      placeholder="Write course details"></textarea>

        </div>

        <div class="row">

            <div class="col-md-6 mb-4">

                <label class="form-label">
                    Course Duration
                </label>

                <input type="text"
                       name="duration"
                       class="form-control"
                       placeholder="3 Months">

            </div>

            <div class="col-md-6 mb-4">

                <label class="form-label">
                    Course Level
                </label>

                <select name="level"
                        class="form-select">

                    <option>
                        Beginner
                    </option>

                    <option>
                        Intermediate
                    </option>

                    <option>
                        Advanced
                    </option>

                </select>

            </div>

        </div>

        <div class="row">

            <div class="col-md-6 mb-4">

                <label class="form-label">
                    Course Thumbnail
                </label>

                <input type="file"
                       name="image"
                       class="form-control">

            </div>

            <div class="col-md-6 mb-4">

                <label class="form-label">
                    YouTube Video Link
                </label>

                <input type="url"
                       name="youtube_link"
                       class="form-control"
                       placeholder="https://youtube.com/watch?v=...">

            </div>

        </div>

        <button type="submit"
                class="btn-submit">

            <i class="fa-solid fa-plus"></i>

            Add Course

        </button>

    </form>

</div>

</body>
</html>
