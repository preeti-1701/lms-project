<!DOCTYPE html>
<html>
<head>
<title>Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    font-family:'Poppins', sans-serif;
    background: linear-gradient(135deg,#0f172a,#1e3a8a);
}

/* MAIN CARD */
.card {
    width:450px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
    animation: fade 0.5s ease;
}

/* PROFILE HEADER */
.profile-header {
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

/* AVATAR */
.avatar {
    width:60px;
    height:60px;
    border-radius:50%;
    background: linear-gradient(90deg,#06b6d4,#3b82f6);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:24px;
    font-weight:bold;
}

/* NAME */
.name {
    font-size:20px;
    font-weight:600;
}

/* SUBTEXT */
.sub {
    font-size:13px;
    color:#666;
}

/* INPUTS */
input {
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #ddd;
    outline:none;
    transition:0.3s;
}

input:focus {
    border-color:#3b82f6;
    box-shadow:0 0 6px rgba(59,130,246,0.3);
}

/* ROW */
.row {
    display:flex;
    gap:10px;
}

/* BUTTON */
button {
    width:100%;
    padding:12px;
    margin-top:12px;
    background: linear-gradient(90deg,#06b6d4,#3b82f6);
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    transition:0.3s;
}

button:hover {
    transform: scale(1.03);
}

/* BACK */
.back {
    display:block;
    text-align:center;
    margin-top:15px;
    text-decoration:none;
    color:#3b82f6;
}

/* ANIMATION */
@keyframes fade {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1;}
}
</style>

</head>

<body>

<div class="card">

<!-- PROFILE HEADER -->
<div class="profile-header">

    <!-- Avatar -->
    <div class="avatar">
        {{ request.user.username|first|upper }}
    </div>

    <!-- Name + Info -->
    <div>
        <div class="name">
            {{ profile.full_name|default:request.user.username }}
        </div>
        <div class="sub">
            {{ profile.college|default:"College" }} | 
            {{ profile.branch|default:"Branch" }}
        </div>
    </div>

</div>

<!-- FORM -->
<form method="POST">
{% csrf_token %}

<input name="full_name" value="{{ profile.full_name|default:'' }}" placeholder="Full Name">

<input name="roll_number" value="{{ profile.roll_number|default:'' }}" placeholder="Roll Number">

<input name="phone" value="{{ profile.phone|default:'' }}" placeholder="Phone Number">

<div class="row">
    <input type="number" name="age" value="{{ profile.age|default:'' }}" placeholder="Age">

    <!-- DATE WITH YEAR SELECTOR -->
    <input type="date" name="dob"
           value="{{ profile.dob|date:'Y-m-d' }}"
           min="1980-01-01" max="2030-12-31">
</div>

<input name="college" value="{{ profile.college|default:'' }}" placeholder="College Name">

<input name="branch" value="{{ profile.branch|default:'' }}" placeholder="Branch">

<button type="submit">Update Profile</button>

</form>

<a href="/" class="back">← Back to Dashboard</a>

</div>

</body>
</html>
