<!-- login.html -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnify LMS</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

<div class="container-fluid h-100">

    <div class="row h-100">

        <!-- LEFT SECTION -->
        <div class="col-md-7 left-section d-flex flex-column justify-content-center align-items-center">

            <!-- LOGO -->
            <div class="text-center">

                <div class="premium-logo mb-4">
                    <i class="fas fa-graduation-cap"></i>
                </div>

                <h1 class="brand-title">
                    Learnify
                </h1>

                <p class="brand-subtitle mb-5">
                    Next Generation Learning Platform
                </p>

            </div>

            <!-- FEATURES -->
            <div class="features-container">

                <div class="feature-card">
                    <i class="fas fa-video feature-icon"></i>
                    <span>Video Learning</span>
                </div>

                <div class="feature-card">
                    <i class="fas fa-chart-line feature-icon"></i>
                    <span>Automatic Progress Tracking</span>
                </div>

                <div class="feature-card">
                    <i class="fas fa-user-graduate feature-icon"></i>
                    <span>Trainer & Student Management</span>
                </div>

            </div>

        </div>

        <!-- RIGHT SECTION -->
        <div class="col-md-5 d-flex justify-content-center align-items-center">

            <div class="glass-login-card">

                <h2 class="text-center mb-4 fw-bold text-white">
                    Welcome Back
                </h2>

                <p class="text-center text-light mb-4">
                    Login to continue learning
                </p>

                <!-- USERNAME -->
                <div class="mb-3">

                    <label class="form-label text-white">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        class="form-control custom-input"
                        placeholder="Enter Username">

                </div>

                <!-- PASSWORD -->
                <div class="mb-4">

                    <label class="form-label text-white">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control custom-input"
                        placeholder="Enter Password">

                </div>

                <!-- LOGIN BUTTON -->
                <button onclick="login()" class="btn login-btn w-100">

                    <i class="fas fa-sign-in-alt"></i>
                    Login

                </button>

            </div>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
