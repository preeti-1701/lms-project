<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <title>Manage Users</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="container py-5">

    <h1 class="mb-4">
        Manage Users 👨‍💻
    </h1>

    <!-- CREATE USER -->

    <div class="card p-4 mb-4">

        <h3>Create User</h3>

        <input
            type="text"
            id="newUsername"
            class="form-control mb-3"
            placeholder="Username"
        />

        <input
            type="password"
            id="newPassword"
            class="form-control mb-3"
            placeholder="Password"
        />

        <select
            id="newRole"
            class="form-control mb-3"
        >
            <option value="student">
                Student
            </option>

            <option value="trainer">
                Trainer
            </option>

            <option value="admin">
                Admin
            </option>
        </select>

        <button
            onclick="createUser()"
            class="btn btn-primary"
        >
            Create User
        </button>

    </div>

    <!-- USERS LIST -->

    <div id="usersList">

    </div>

    <button
        onclick="goBack()"
        class="btn btn-secondary mt-4"
    >
        ← Back
    </button>

</div>

<script src="app.js"></script>

</body>
</html>
