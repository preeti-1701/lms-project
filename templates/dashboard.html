<!DOCTYPE html>

<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<div class="d-flex justify-content-between">
    <h2>My Courses</h2>
    <button class="btn btn-danger" onclick="logout()">Logout</button>
</div>

<div id="courses" class="mt-4"></div>

<script>
    function logout() {
        localStorage.removeItem("token");
        window.location.href = "/";
    }

    async function loadCourses() {
        const token = localStorage.getItem("token");

        if (!token) {
            window.location.href = "/";
            return;
        }

        const response = await fetch("/api/my-courses/", {
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        if (response.status === 401) {
            alert("Session expired. Please login again.");
            logout();
            return;
        }

        const data = await response.json();
        const container = document.getElementById("courses");

        if (data.length === 0) {
            container.innerHTML = "<p class='text-muted'>No courses have been assigned to you yet.</p>";
            return;
        }

        // Loop through the data and create the elements
        data.forEach(course => {
            // 1. Create the div! (This was missing)
            const div = document.createElement("div");
            div.className = "card p-3 mb-3";

           // REAL PROGRESS LOGIC
            const totalVideos = course.videos ? course.videos.length : 0;
            // Filter videos where completed === true
            const completedVideos = course.videos ? course.videos.filter(v => v.completed).length : 0; 
            const progressPercent = totalVideos === 0 ? 0 : Math.round((completedVideos / totalVideos) * 100);

            // 2. Set the HTML
            div.innerHTML = `
                <h4>${course.title}</h4>
                <p>${course.description}</p>
                
                <div class="progress mb-3">
                    <div class="progress-bar bg-success" role="progressbar" style="width: ${progressPercent}%" aria-valuenow="${progressPercent}" aria-valuemin="0" aria-valuemax="100">${progressPercent}%</div>
                </div>

                <button class="btn btn-primary" onclick="viewCourse(${course.id})">Open Course</button>
            `;
            
            // 3. Append the div to the page container! (This was also missing)
            container.appendChild(div);
        });
    }

    function viewCourse(courseId) {
        window.location.href = `/course/${courseId}/`;
    }

    loadCourses();
</script>

</body>
</html>
