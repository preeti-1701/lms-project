<!DOCTYPE html>
<html>
<head>
    <title>Manage Course Videos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<div class="d-flex justify-content-between mb-4">
    <h2>Manage Course Videos</h2>
    <button class="btn btn-secondary" onclick="window.location.href='/trainer/'">Back to Dashboard</button>
</div>

<div class="row">
    <div class="col-md-4">
        <div class="card p-3 shadow-sm position-sticky" style="top: 20px;">
            <h4>Add New Video</h4>
            <input class="form-control mb-2" id="videoTitle" placeholder="Video Title (e.g., Chapter 1)">
            <input class="form-control mb-3" id="ytLink" placeholder="YouTube URL (https://...)">
            <button class="btn btn-success" onclick="addVideo()">Add to Course</button>
        </div>
    </div>

    <div class="col-md-8">
        <h4>Current Videos</h4>
        <div id="video-list"></div>
    </div>
</div>

<script>
    const courseId = window.location.pathname.split("/")[3];

    async function authFetch(url, options = {}) {
        const token = localStorage.getItem("token");
        options.headers = { ...options.headers, "Authorization": "Bearer " + token };
        return fetch(url, options);
    }

    async function loadVideos() {
        const response = await authFetch("/api/trainer-courses/");
        const courses = await response.json();
        
        const course = courses.find(c => c.id == courseId);
        const container = document.getElementById("video-list");
        container.innerHTML = "";

        if (course.videos && course.videos.length > 0) {
            course.videos.forEach(v => {
                // FIX: Used v.youtube_link for the anchor tag instead of embed_url
                container.innerHTML += `
                    <div class="card p-3 mb-3 shadow-sm border-0 bg-light">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="mb-1">${v.title}</h5>
                                <a href="${v.youtube_link}" target="_blank" class="small text-decoration-none">🎥 Watch on YouTube</a>
                            </div>
                            <div>
                                <button class="btn btn-sm btn-outline-primary me-2" onclick="showEditForm(${v.id})">Edit</button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteVideo(${v.id})">Delete</button>
                            </div>
                        </div>
                        
                        <div id="edit-form-${v.id}" class="mt-3 p-3 bg-white border rounded shadow-sm" style="display: none;">
                            <label class="small text-muted mb-1">Edit Title</label>
                            <input class="form-control mb-2" id="edit-title-${v.id}" value="${v.title}">
                            <label class="small text-muted mb-1">Edit YouTube Link</label>
                            <input class="form-control mb-3" id="edit-link-${v.id}" value="${v.youtube_link}">
                            <button class="btn btn-sm btn-primary" onclick="updateVideo(${v.id})">Save Changes</button>
                            <button class="btn btn-sm btn-secondary" onclick="showEditForm(${v.id})">Cancel</button>
                        </div>
                    </div>`;
            });
        } else {
            container.innerHTML = "<p class='text-muted'>No videos added yet.</p>";
        }
    }

    async function addVideo() {
        const payload = {
            title: document.getElementById("videoTitle").value,
            youtube_link: document.getElementById("ytLink").value
        };

        const res = await authFetch(`/api/add-video/${courseId}/`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            document.getElementById("videoTitle").value = "";
            document.getElementById("ytLink").value = "";
            loadVideos(); 
        } else {
            alert("Failed to add video.");
        }
    }

    // --- NEW EDIT & DELETE FUNCTIONS ---

    function showEditForm(videoId) {
        const form = document.getElementById(`edit-form-${videoId}`);
        form.style.display = form.style.display === "none" ? "block" : "none";
    }

    async function updateVideo(videoId) {
        const payload = {
            title: document.getElementById(`edit-title-${videoId}`).value,
            youtube_link: document.getElementById(`edit-link-${videoId}`).value
        };

        const res = await authFetch(`/api/manage-video/${videoId}/`, {
            method: "PUT", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            loadVideos(); // Reloads the UI with the updated data
        } else {
            alert("Failed to update video.");
        }
    }

    async function deleteVideo(videoId) {
        if (confirm("Are you sure you want to delete this video? This cannot be undone.")) {
            const res = await authFetch(`/api/manage-video/${videoId}/`, {
                method: "DELETE"
            });

            if (res.ok) {
                loadVideos(); // Refreshes the list to remove the deleted item
            } else {
                alert("Failed to delete video.");
            }
        }
    }

    loadVideos();
</script>
</body>
</html>
