<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ video.title }} - LMS</title>
    <style>
        body { margin: 0; background: #000; font-family: Arial, sans-serif; }
        .watermark {
            position: absolute; top: 20px; right: 20px; color: rgba(255,255,255,0.6);
            font-size: 18px; pointer-events: none; z-index: 10; text-shadow: 2px 2px 4px #000;
        }
        .container { position: relative; }
    </style>
</head>
<body>
    <div class="container">
        <div class="watermark" id="watermark">
            {{ user.email }} | {{ video.course.title }}
        </div>
        
        <iframe width="100%" height="600" 
                src="https://www.youtube.com/embed/{{ video.youtube_link|split:'v='|last }}" 
                frameborder="0" allowfullscreen>
        </iframe>
    </div>

    <script>
        // Anti-copy protection
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
