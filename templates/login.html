<!DOCTYPE html>

<html>
<head>
    <title>LMS Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h2>Login</h2>

<body class="container mt-5">
    <h2 class="mb-4">LMS Login</h2>

<div class="card p-4" style="max-width:400px;">
    <input class="form-control mb-3" type="email" id="email" placeholder="Email">
    <input class="form-control mb-3" type="password" id="password" placeholder="Password">

    <button class="btn btn-primary" onclick="login()">Login</button>
    <p id="error" class="text-danger mt-2"></p>
</div>


</body>


<script>
    async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const response = await fetch("/api/login/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
            localStorage.setItem("token", data.access);
            // Update the redirect logic here:
            if (data.role === "admin") {
                window.location.href = "/admin-dashboard/";
            } else if (data.role === "trainer") {
                window.location.href = "/trainer/";
            } else {
                window.location.href = "/dashboard/";
            }
        } else {
            document.getElementById("error").innerText = data.error || "Login failed";
        }
    }
</script>


</body>
</html>
