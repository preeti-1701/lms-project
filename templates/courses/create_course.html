{% extends 'base.html' %}
{% block title %}Create New Course{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-6">
        <div class="card">
            <div class="card-header bg-white">
                <h4 class="mb-1">
                    <i class="fas fa-plus-circle"></i> Create New Course
                </h4>
                <p class="text-muted mb-0">Submit a course for admin approval.</p>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Course Title</label>
                        <input type="text"
                               name="title"
                               class="form-control"
                               placeholder="Enter course title"
                               required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea name="description"
                                  class="form-control"
                                  rows="6"
                                  placeholder="Enter course description..."
                                  required></textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-save"></i> Create Course
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="{% url 'course_list' %}" class="text-muted">Back to Courses</a>
        </div>
    </div>
</div>
{% endblock %}
