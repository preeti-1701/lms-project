<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Video - LMS</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; padding: 20px; }
        .form-container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 12px 30px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Add Video to: {{ course.title }}</h2>
        <form method="POST">
            {% csrf_token %}
            <label>Video Title</label>
            <input type="text" name="title" required>
            
            <label>YouTube Link (full URL)</label>
            <input type="url" name="youtube_link" placeholder="https://youtube.com/watch?v=..." required>
            
            <button type="submit">Add Video</button>
        </form>
        <a href="{% url 'course_detail' course.id %}">← Back to Course</a>
    </div>
</body>
</html>
