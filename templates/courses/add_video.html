{% extends 'base.html' %}
{% block title %}Add Video - {{ course.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">
                    <i class="fas fa-video"></i> Add Video to "{{ course.title }}"
                </h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Video Title</label>
                        <input type="text" 
                               name="title" 
                               class="form-control" 
                               placeholder="e.g. Module 1 - Introduction"
                               required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">YouTube Video Link</label>
                        <input type="url" 
                               name="youtube_link" 
                               class="form-control" 
                               placeholder="https://www.youtube.com/watch?v=..."
                               required>
                        <small class="text-muted">Full YouTube URL</small>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-plus"></i> Add Video
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="{% url 'course_detail' course.pk %}" class="text-muted">
                ← Back to Course
            </a>
        </div>
    </div>
</div>
{% endblock %}
